<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drive Mad 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-badge {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 18px;
      backdrop-filter: blur(5px);
    }
    .btn-ui {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      color: #222;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    .btn-ui:active {
      transform: scale(0.95);
    }
    #touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      user-select: none;
      backdrop-filter: blur(4px);
    }
    .touch-btn:active {
      background: rgba(255, 255, 255, 0.6);
    }
    .touch-group {
      display: flex;
      gap: 15px;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      pointer-events: auto;
      z-index: 10;
    }
    #overlay.hidden {
      display: none;
    }
    #overlay h1 {
      font-size: 42px;
      margin-bottom: 10px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    #overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #ccc;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div class="header">
        <div class="level-badge" id="level-display">Level 1</div>
        <button class="btn-ui" onclick="restartLevel()">Restart (R)</button>
      </div>
      <div id="touch-controls">
        <div class="touch-group">
          <div class="touch-btn" id="btn-left">◄</div>
          <div class="touch-btn" id="btn-right">►</div>
        </div>
      </div>
    </div>
    <div id="overlay">
      <h1 id="overlay-title">LEVEL COMPLETE!</h1>
      <p id="overlay-subtitle">Get ready for the next challenge</p>
      <button class="btn-ui" style="font-size: 20px; padding: 14px 28px;" id="overlay-btn" onclick="nextLevel()">Next Level</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, world;
    let chassisBody, vehicle;
    let wheelBodies = [], wheelMeshes = [];
    let chassisMesh, shatterParts = [];
    let isShattered = false, levelComplete = false;
    let currentLevel = 1;
    let spawnTime = 0;
    
    const input = { forward: false, reverse: false, jump: false };
    const levelPlatforms = [];

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x70c5ff);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      world = new CANNON.World();
      world.gravity.set(0, -20, 0);

      setupInputs();
      loadLevel(currentLevel);

      window.addEventListener('resize', onWindowResize);
      animate(0);
    }

    function setupInputs() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.forward = true;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.reverse = true;
        if (e.code === 'Space') jumpCar();
        if (e.code === 'KeyR') restartLevel();
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') input.forward = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.reverse = false;
      });

      const btnLeft = document.getElementById('btn-left');
      const btnRight = document.getElementById('btn-right');

      btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); input.reverse = true; });
      btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); input.reverse = false; });
      btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); input.forward = true; });
      btnRight.addEventListener('touchend', (e) => { e.preventDefault(); input.forward = false; });
    }

    function createCar() {
      const chassisShape = new CANNON.Box(new CANNON.Vec3(1.2, 0.5, 0.8));
      chassisBody = new CANNON.Body({ mass: 150 });
      chassisBody.addShape(chassisShape);
      chassisBody.position.set(0, 6.0, 0);
      
      chassisBody.angularFactor = new CANNON.Vec3(0, 0, 1);
      chassisBody.linearFactor = new CANNON.Vec3(1, 1, 0);

      vehicle = new CANNON.RaycastVehicle({
        chassisBody: chassisBody
      });

      const wheelOptions = {
        radius: 0.6,
        directionLocal: new CANNON.Vec3(0, -1, 0),
        suspensionStiffness: 45,
        suspensionRestLength: 0.4,
        frictionSlip: 5,
        dampingRelaxation: 2.3,
        dampingCompression: 4.4,
        maxSuspensionForce: 100000,
        rollInfluence: 0.01,
        axleLocal: new CANNON.Vec3(0, 0, 1),
        chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
        maxSuspensionTravel: 0.3,
        customSlidingRotationalSpeed: -30,
        useCustomSlidingRotationalSpeed: true
      };

      wheelOptions.chassisConnectionPointLocal.set(0.9, -0.2, 0.8);
      vehicle.addWheel(wheelOptions);
      wheelOptions.chassisConnectionPointLocal.set(0.9, -0.2, -0.8);
      vehicle.addWheel(wheelOptions);
      wheelOptions.chassisConnectionPointLocal.set(-0.9, -0.2, 0.8);
      vehicle.addWheel(wheelOptions);
      wheelOptions.chassisConnectionPointLocal.set(-0.9, -0.2, -0.8);
      vehicle.addWheel(wheelOptions);

      vehicle.addToWorld(world);

      chassisMesh = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
      const roofMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });

      const baseBlock = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.8, 1.4), bodyMat);
      baseBlock.castShadow = true;
      chassisMesh.add(baseBlock);

      const cabBlock = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 1.2), roofMat);
      cabBlock.position.set(-0.2, 0.7, 0);
      cabBlock.castShadow = true;
      chassisMesh.add(cabBlock);

      scene.add(chassisMesh);

      chassisBody.addEventListener("collide", (e) => {
        if (Date.now() - spawnTime < 400 || isShattered) return;
        
        const contact = e.contact;
        const normal = contact.bi.id === chassisBody.id ? contact.ni : contact.ni.negate();

        if (normal.y < -0.3) {
          shatterCar();
        }
      });

      wheelMeshes = [];
      const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.5, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
      wheelGeo.rotateX(Math.PI / 2);

      for (let i = 0; i < 4; i++) {
        const wMesh = new THREE.Mesh(wheelGeo, wheelMat);
        wMesh.castShadow = true;
        scene.add(wMesh);
        wheelMeshes.push(wMesh);
      }

      spawnTime = Date.now();
    }

    function jumpCar() {
      if (!isShattered && chassisBody && Math.abs(chassisBody.velocity.y) < 2) {
        chassisBody.velocity.y = 8;
      }
    }

    function shatterCar() {
      if (isShattered) return;
      isShattered = true;

      scene.remove(chassisMesh);
      wheelMeshes.forEach(m => scene.remove(m));

      for (let i = 0; i < 15; i++) {
        const size = 0.2 + Math.random() * 0.3;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(size, size, size),
          new THREE.MeshStandardMaterial({ color: Math.random() > 0.3 ? 0xffcc00 : 0xdddddd })
        );
        mesh.position.copy(chassisBody.position);
        mesh.position.x += (Math.random() - 0.5) * 1.5;
        mesh.position.y += (Math.random() - 0.5) * 1.0;
        scene.add(mesh);

        shatterParts.push({
          mesh: mesh,
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 12,
            Math.random() * 10 + 2,
            (Math.random() - 0.5) * 12
          ),
          rot: new THREE.Vector3(Math.random(), Math.random(), Math.random())
        });
      }

      setTimeout(() => {
        restartLevel();
      }, 1500);
    }

    function clearLevel() {
      levelPlatforms.forEach(p => {
        scene.remove(p.mesh);
        world.remove(p.body);
      });
      levelPlatforms.length = 0;

      if (chassisBody) {
        vehicle.removeFromWorld(world);
        scene.remove(chassisMesh);
        wheelMeshes.forEach(m => scene.remove(m));
      }

      shatterParts.forEach(p => scene.remove(p.mesh));
      shatterParts = [];
      isShattered = false;
      levelComplete = false;
    }

    function addBlock(x, y, z, w, h, d, color = 0x44aa44) {
      const body = new CANNON.Body({ mass: 0 });
      body.addShape(new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)));
      body.position.set(x, y, z);
      world.addBody(body);

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: color })
      );
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      scene.add(mesh);

      levelPlatforms.push({ body, mesh });
    }

    function loadLevel(lvl) {
      clearLevel();
      document.getElementById('level-display').innerText = `Level ${lvl}`;
      document.getElementById('overlay').classList.add('hidden');

      addBlock(0, 2, 0, 10, 4, 4, 0x44aa44);
      addBlock(-5, 5, 0, 0.4, 3, 4, 0x885522);

      let curX = 5;
      const gap = Math.min(4 + lvl * 0.2, 14);
      curX += gap;

      addBlock(curX + 10, 2, 0, 20, 4, 4, 0x44aa44);

      if (lvl > 2) {
        for (let i = 0; i < Math.min(lvl, 8); i++) {
          addBlock(curX + 2 + i * 1.5, 4.3 + i * 0.2, 0, 0.8, 0.6, 3, 0xdd6622);
        }
      }

      const flag = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 3, 0.2),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
      );
      flag.position.set(curX + 18, 5.5, 0);
      scene.add(flag);

      createCar();
    }

    function restartLevel() {
      loadLevel(currentLevel);
    }

    function nextLevel() {
      currentLevel++;
      loadLevel(currentLevel);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      world.step(1 / 60);

      if (!isShattered && chassisBody) {
        const force = 400;
        if (input.forward) {
          vehicle.applyEngineForce(-force, 2);
          vehicle.applyEngineForce(-force, 3);
        } else if (input.reverse) {
          vehicle.applyEngineForce(force, 2);
          vehicle.applyEngineForce(force, 3);
        } else {
          vehicle.applyEngineForce(0, 2);
          vehicle.applyEngineForce(0, 3);
        }

        chassisMesh.position.copy(chassisBody.position);
        chassisMesh.quaternion.copy(chassisBody.quaternion);

        for (let i = 0; i < vehicle.wheelInfos.length; i++) {
          vehicle.updateWheelTransform(i);
          const t = vehicle.wheelInfos[i].worldTransform;
          wheelMeshes[i].position.copy(t.position);
          wheelMeshes[i].quaternion.copy(t.quaternion);
        }

        camera.position.x = chassisBody.position.x + 2;
        camera.position.y = chassisBody.position.y + 4;
        camera.position.z = 12;
        camera.lookAt(chassisBody.position.x + 2, chassisBody.position.y, 0);

        if (chassisBody.position.y < -5) {
          shatterCar();
        }

        if (chassisBody.position.x > 20 && !levelComplete) {
          levelComplete = true;
          document.getElementById('overlay-title').innerText = `LEVEL ${currentLevel} CLEARED!`;
          document.getElementById('overlay').classList.remove('hidden');
        }
      }

      if (isShattered) {
        shatterParts.forEach(p => {
          p.mesh.position.addScaledVector(p.vel, 0.016);
          p.vel.y -= 0.3;
          p.mesh.rotation.x += p.rot.x * 0.1;
          p.mesh.rotation.y += p.rot.y * 0.1;
        });
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
